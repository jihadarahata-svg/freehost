<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — FreeHost</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    background: #0a0a0f; color: #fff; min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .glow {
    position: fixed; top: -200px; left: 50%; transform: translateX(-50%);
    width: 800px; height: 600px;
    background: radial-gradient(ellipse at center, rgba(139,92,246,0.15), transparent 70%);
    pointer-events: none; z-index: 0;
  }
  .wrap { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 20px; }
  
  .nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.06); margin-bottom: 32px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 9px;
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    display: flex; align-items: center; justify-content: center; font-size: 15px;
  }
  .nav-right { display: flex; align-items: center; gap: 12px; }
  .user-info { display: flex; align-items: center; gap: 10px; }
  .user-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px;
  }
  .user-name { font-size: 13px; font-weight: 600; }
  .user-email { font-size: 11px; color: #71717a; }
  .logout-btn {
    padding: 8px 14px; background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1); color: #a1a1aa;
    border-radius: 8px; font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .logout-btn:hover { background: rgba(239,68,68,0.1); color: #f87171; }
  @media (max-width: 500px) { .user-name, .user-email { display: none; } }
  
  h1 { font-size: 28px; font-weight: 800; margin-bottom: 8px; letter-spacing: -1px; }
  .welcome-sub { color: #a1a1aa; font-size: 14px; margin-bottom: 32px; }
  
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 32px; }
  @media (max-width: 600px) { .stats { grid-template-columns: 1fr; } }
  .stat {
    background: linear-gradient(180deg, #101018, #0d0d14);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px; padding: 20px;
  }
  .stat-label { font-size: 11px; color: #71717a; text-transform: uppercase; letter-spacing: 0.8px; font-weight: 600; margin-bottom: 8px; }
  .stat-value {
    font-size: 26px; font-weight: 800; letter-spacing: -1px;
    background: linear-gradient(135deg, #c4b5fd, #8b5cf6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  
  .actions { display: flex; gap: 12px; margin-bottom: 32px; flex-wrap: wrap; }
  .btn-primary {
    flex: 1; min-width: 180px; padding: 16px 24px;
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    color: #fff; border: none; border-radius: 12px;
    font-size: 14px; font-weight: 700; cursor: pointer;
    text-decoration: none; text-align: center;
    display: flex; align-items: center; justify-content: center;
    gap: 8px; box-shadow: 0 12px 30px -8px rgba(139,92,246,0.5);
    transition: 0.2s; font-family: inherit;
  }
  .btn-primary:hover { transform: translateY(-2px); }
  
  .section-title {
    font-size: 13px; font-weight: 700; color: #71717a;
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px;
  }
  
  .page-card {
    background: linear-gradient(180deg, #101018, #0d0d14);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px; padding: 18px; margin-bottom: 12px;
  }
  .page-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .page-url { color: #c4b5fd; font-size: 12px; font-family: monospace; text-decoration: none; word-break: break-all; }
  .page-url:hover { text-decoration: underline; }
  .page-meta { display: flex; gap: 16px; font-size: 12px; color: #71717a; margin-top: 10px; flex-wrap: wrap; }
  .page-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .mini-btn {
    padding: 7px 12px; background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1); color: #d4d4d8;
    border-radius: 7px; font-size: 11px; font-weight: 600;
    cursor: pointer; font-family: inherit; text-decoration: none;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .mini-btn:hover { background: rgba(139,92,246,0.2); color: #c4b5fd; }
  .mini-btn.danger:hover { background: rgba(239,68,68,0.15); color: #f87171; }
  
  .empty {
    text-align: center; padding: 60px 20px;
    background: linear-gradient(180deg, #101018, #0d0d14);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
  }
  .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.6; }
  .empty-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .empty-desc { color: #71717a; font-size: 14px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    
    <nav class="nav">
      <div class="brand">
        <div class="brand-mark">◆</div>
        <span>FreeHost</span>
      </div>
      <div class="nav-right">
        <div class="user-info">
          <div class="user-avatar" id="userAvatar">U</div>
          <div>
            <div class="user-name" id="userName">Loading...</div>
            <div class="user-email" id="userEmail"></div>
          </div>
        </div>
        <button class="logout-btn" onclick="doLogout()">Logout</button>
      </div>
    </nav>
    
    <h1>My Dashboard</h1>
    <p class="welcome-sub">Manage all your hosted pages</p>
    
    <div class="stats">
      <div class="stat">
        <div class="stat-label">Total Pages</div>
        <div class="stat-value" id="statPages">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Total Views</div>
        <div class="stat-value" id="statViews">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Wallet Balance</div>
        <div class="stat-value" id="statWallet">৳0</div>
      </div>
    </div>
    
    <div class="actions">
      <a href="/" class="btn-primary">+ Host New Page</a>
      <a href="/shop" class="btn-primary" style="background: linear-gradient(135deg, #10b981, #059669);">🛍 Visit Shop</a>
    </div>
    
    <div class="section-title">My Pages</div>
    <div id="pagesContainer">
      <div class="empty">
        <div class="empty-icon">⏳</div>
        <div class="empty-title">Loading...</div>
      </div>
    </div>
  </div>
  
  <script>
    async function loadUser() {
      try {
        const res = await fetch('/api/me');
        if (!res.ok) { window.location.href = '/login'; return null; }
        const user = await res.json();
        document.getElementById('userName').textContent = user.name || 'User';
        document.getElementById('userEmail').textContent = user.email || '';
        document.getElementById('userAvatar').textContent = (user.name || 'U').charAt(0).toUpperCase();
        document.getElementById('statWallet').textContent = '৳' + (user.wallet || 0);
        return user;
      } catch (e) {
        window.location.href = '/login';
        return null;
      }
    }
    
    async function loadPages() {
      try {
        const res = await fetch('/api/my-pages');
        if (!res.ok) throw new Error('Failed');
        const pages = await res.json();
        
        document.getElementById('statPages').textContent = pages.length;
        document.getElementById('statViews').textContent = pages.reduce((s, p) => s + (p.views || 0), 0);
        
        const c = document.getElementById('pagesContainer');
        if (!pages.length) {
          c.innerHTML = '<div class="empty"><div class="empty-icon">📄</div><div class="empty-title">No pages yet</div><div class="empty-desc">Host your first HTML page</div></div>';
          return;
        }
        
        c.innerHTML = pages.map(p => {
          const url = location.origin + '/p/' + p._id;
          return '<div class="page-card">' +
            '<h3>' + esc(p.title) + '</h3>' +
            '<a class="page-url" href="' + url + '" target="_blank">' + url + '</a>' +
            '<div class="page-meta">' +
              '<span>👁 ' + (p.views || 0) + ' views</span>' +
              '<span>📅 ' + new Date(p.createdAt).toLocaleDateString() + '</span>' +
            '</div>' +
            '<div class="page-actions">' +
              '<a href="' + url + '" target="_blank" class="mini-btn">🔗 Open</a>' +
              '<button class="mini-btn" onclick="copyLink(\'' + url + '\', this)">📋 Copy</button>' +
            '</div>' +
          '</div>';
        }).join('');
      } catch (e) {
        document.getElementById('pagesContainer').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-title">Failed to load</div></div>';
      }
    }
    
    function copyLink(url, btn) {
      navigator.clipboard.writeText(url);
      const old = btn.textContent;
      btn.textContent = '✅ Copied';
      setTimeout(() => btn.textContent = old, 1500);
    }
    
    async function doLogout() {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/';
    }
    
    function esc(s) {
      return String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }
    
    async function init() {
      const user = await loadUser();
      if (user) loadPages();
    }
    init();
  </script>
</body>
</html>
