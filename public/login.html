<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — FreeHost</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    background: #0a0a0f; color: #fff; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .card {
    width: 100%; max-width: 420px;
    background: linear-gradient(180deg, #101018, #0d0d14);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px; padding: 36px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .logo {
    width: 60px; height: 60px; margin: 0 auto 18px;
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    box-shadow: 0 12px 30px -8px rgba(139,92,246,0.6);
  }
  h1 { font-size: 24px; font-weight: 800; margin-bottom: 6px; text-align: center; letter-spacing: -0.5px; }
  .sub { color: #a1a1aa; font-size: 13px; margin-bottom: 24px; text-align: center; }
  
  .ref-banner {
    background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(5,150,105,0.1));
    border: 1px solid rgba(16,185,129,0.4);
    border-radius: 12px; padding: 14px 16px;
    margin-bottom: 20px;
    display: none; align-items: center; gap: 12px;
  }
  .ref-banner.show { display: flex; }
  .ref-banner-icon { font-size: 28px; }
  .ref-banner-text { flex: 1; }
  .ref-banner-text strong { display: block; font-size: 14px; color: #34d399; margin-bottom: 3px; font-weight: 700; }
  .ref-banner-text span { font-size: 11px; color: #a1a1aa; line-height: 1.4; }
  
  .tabs {
    display: flex;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 4px;
    margin-bottom: 20px;
  }
  .tab {
    flex: 1; padding: 10px; text-align: center;
    border-radius: 9px; font-size: 14px; font-weight: 600;
    cursor: pointer; color: #a1a1aa; transition: 0.2s;
  }
  .tab.active {
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    color: #fff;
  }
  
  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block; font-size: 11px; color: #71717a;
    margin-bottom: 6px; text-transform: uppercase;
    font-weight: 600; letter-spacing: 0.5px;
  }
  .form-group input {
    width: 100%; padding: 13px 15px;
    background: rgba(0,0,0,0.4);
    border: 1.5px solid rgba(255,255,255,0.08);
    border-radius: 10px; color: #fff;
    font-size: 14px; outline: none; font-family: inherit;
    transition: 0.2s;
  }
  .form-group input:focus {
    border-color: rgba(139,92,246,0.6);
    background: rgba(139,92,246,0.05);
    box-shadow: 0 0 0 4px rgba(139,92,246,0.1);
  }
  .form-group input::placeholder { color: #52525b; }
  
  .btn {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    color: #fff; border: none; border-radius: 11px;
    font-size: 15px; font-weight: 700;
    cursor: pointer; font-family: inherit;
    margin-top: 8px; transition: 0.2s;
    box-shadow: 0 12px 30px -8px rgba(139,92,246,0.5);
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  
  .error {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: 10px; padding: 10px 14px;
    font-size: 13px; color: #f87171;
    margin-bottom: 16px; display: none;
  }
  .error.show { display: block; }
  
  .success {
    background: rgba(16,185,129,0.1);
    border: 1px solid rgba(16,185,129,0.3);
    border-radius: 10px; padding: 10px 14px;
    font-size: 13px; color: #34d399;
    margin-bottom: 16px; display: none;
  }
  .success.show { display: block; }
  
  .warning {
    background: rgba(251,146,60,0.1);
    border: 1px solid rgba(251,146,60,0.3);
    border-radius: 10px; padding: 10px 14px;
    font-size: 13px; color: #fb923c;
    margin-bottom: 16px; display: none;
  }
  .warning.show { display: block; }
  
  .back {
    display: block; text-align: center;
    margin-top: 20px; color: #a1a1aa;
    font-size: 13px; text-decoration: none;
  }
  .back:hover { color: #fff; }
  
  .bonus-pill {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(16,185,129,0.15);
    color: #34d399; padding: 2px 8px;
    border-radius: 20px; font-size: 10px;
    font-weight: 700; margin-left: 6px;
    text-transform: none; letter-spacing: 0;
  }
  
  .terms {
    margin-top: 20px; padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.06);
    font-size: 11px; color: #52525b;
    text-align: center; line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">◆</div>
    <h1 id="welcomeTitle">Welcome to FreeHost</h1>
    <p class="sub" id="welcomeSubtitle">Sign in or create account to continue</p>
    
    <div class="ref-banner" id="refBanner">
      <div class="ref-banner-icon">🎁</div>
      <div class="ref-banner-text">
        <strong>You've been invited!</strong>
        <span>Sign up and get <strong style="color:#34d399">৳20 bonus</strong> in your wallet instantly!</span>
      </div>
    </div>
    
    <div class="tabs">
      <div class="tab active" id="tabLogin" onclick="switchTab('login')">Sign In</div>
      <div class="tab" id="tabSignup" onclick="switchTab('signup')">Sign Up</div>
    </div>
    
    <div class="error" id="error"></div>
    <div class="success" id="success"></div>
    <div class="warning" id="warning"></div>
    
    <!-- LOGIN FORM -->
    <div id="loginForm">
      <div class="form-group">
        <label id="loginEmailLabel">Email</label>
        <input type="email" id="loginEmail" placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label id="loginPassLabel">Password</label>
        <input type="password" id="loginPassword" placeholder="Your password" onkeypress="if(event.key==='Enter') doLogin()">
      </div>
      <button class="btn" id="loginBtn" onclick="doLogin()">Sign In</button>
    </div>
    
    <!-- SIGNUP FORM -->
    <div id="signupForm" style="display:none;">
      <div class="form-group">
        <label id="signupNameLabel">Full Name</label>
        <input type="text" id="signupName" placeholder="Your name">
      </div>
      <div class="form-group">
        <label id="signupEmailLabel">Email</label>
        <input type="email" id="signupEmail" placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label>
          <span id="signupPassLabel">Password (6+ characters)</span>
          <span class="bonus-pill" id="bonusPill" style="display:none;">🎁 +৳20</span>
        </label>
        <input type="password" id="signupPassword" placeholder="Create password" onkeypress="if(event.key==='Enter') doSignup()">
      </div>
      <button class="btn" id="signupBtn" onclick="doSignup()">Create Account</button>
    </div>
    
    <a href="/" class="back" id="backBtn">← Back to home</a>
    
    <div class="terms" id="termsText">By signing in, you agree to our Terms of Service</div>
  </div>
  
  <script>
    let content = {};
    let refCode = null;
    
    // Capture referral code
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('ref')) {
      refCode = urlParams.get('ref');
      sessionStorage.setItem('refCode', refCode);
    } else {
      refCode = sessionStorage.getItem('refCode');
    }
    
    // Load content from server
    async function loadContent() {
      try {
        const res = await fetch('/api/content');
        content = await res.json();
        const l = content.login || {};
        
        if (l.title) document.getElementById('welcomeTitle').textContent = l.title;
        if (l.subtitle) document.getElementById('welcomeSubtitle').textContent = l.subtitle;
        if (l.signinTab) document.getElementById('tabLogin').textContent = l.signinTab;
        if (l.signupTab) document.getElementById('tabSignup').textContent = l.signupTab;
        if (l.emailLabel) {
          document.getElementById('loginEmailLabel').textContent = l.emailLabel;
          document.getElementById('signupEmailLabel').textContent = l.emailLabel;
        }
        if (l.emailPlaceholder) {
          document.getElementById('loginEmail').placeholder = l.emailPlaceholder;
          document.getElementById('signupEmail').placeholder = l.emailPlaceholder;
        }
        if (l.passwordLabel) document.getElementById('loginPassLabel').textContent = l.passwordLabel;
        if (l.passwordPlaceholder) document.getElementById('loginPassword').placeholder = l.passwordPlaceholder;
        if (l.nameLabel) document.getElementById('signupNameLabel').textContent = l.nameLabel;
        if (l.namePlaceholder) document.getElementById('signupName').placeholder = l.namePlaceholder;
        if (l.signinButton) document.getElementById('loginBtn').textContent = l.signinButton;
        if (l.signupButton) document.getElementById('signupBtn').textContent = l.signupButton;
        if (l.backBtn) document.getElementById('backBtn').textContent = l.backBtn;
        if (l.termsText) document.getElementById('termsText').textContent = l.termsText;
        
        if (l.title) document.title = l.title + ' — FreeHost';
      } catch (e) {
        console.error('Content load failed:', e);
      }
    }
    
    // Show referral banner
    if (refCode) {
      document.getElementById('refBanner').classList.add('show');
      document.getElementById('bonusPill').style.display = 'inline-flex';
      setTimeout(() => switchTab('signup'), 300);
    }
    
    function switchTab(tab) {
      if (tab === 'login') {
        document.getElementById('tabLogin').classList.add('active');
        document.getElementById('tabSignup').classList.remove('active');
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('signupForm').style.display = 'none';
      } else {
        document.getElementById('tabLogin').classList.remove('active');
        document.getElementById('tabSignup').classList.add('active');
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('signupForm').style.display = 'block';
      }
      hideMessages();
    }
    
    function hideMessages() {
      document.getElementById('error').classList.remove('show');
      document.getElementById('success').classList.remove('show');
      document.getElementById('warning').classList.remove('show');
    }
    
    function showError(msg) {
      hideMessages();
      const el = document.getElementById('error');
      el.textContent = msg;
      el.classList.add('show');
    }
    
    function showSuccess(msg) {
      hideMessages();
      const el = document.getElementById('success');
      el.textContent = msg;
      el.classList.add('show');
    }
    
    function showWarning(msg) {
      hideMessages();
      const el = document.getElementById('warning');
      el.textContent = msg;
      el.classList.add('show');
    }
    
    async function doLogin() {
      const btn = document.getElementById('loginBtn');
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      
      if (!email || !password) return showError('Email and password required');
      
      btn.disabled = true;
      const origText = btn.textContent;
      btn.textContent = '⏳ Signing in...';
      hideMessages();
      
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');
        
        showSuccess('✅ Login successful! Redirecting...');
        sessionStorage.removeItem('refCode');
        setTimeout(() => window.location.href = '/dashboard', 800);
      } catch (e) {
        showError('❌ ' + e.message);
        btn.disabled = false;
        btn.textContent = origText;
      }
    }
    
    async function doSignup() {
      const btn = document.getElementById('signupBtn');
      const name = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;
      
      if (!name || !email || !password) return showError('All fields required');
      if (password.length < 6) return showError('Password must be 6+ characters');
      
      btn.disabled = true;
      const origText = btn.textContent;
      btn.textContent = '⏳ Creating account...';
      hideMessages();
      
      try {
        const body = { name, email, password };
        if (refCode) body.referralCode = refCode;
        
        const res = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Signup failed');
        
        // Bonus blocked case
        if (data.bonusBlocked) {
          showWarning('⚠️ Account created, but Referral bonus blocked (same network as referrer). Redirecting...');
          sessionStorage.removeItem('refCode');
          setTimeout(() => window.location.href = '/dashboard', 2000);
          return;
        }
        
        // Success with bonus
        let msg = '✅ Account created!';
        if (data.welcomeBonus) {
          msg += ` 🎁 ৳${data.welcomeBonus} welcome bonus added!`;
        }
        showSuccess(msg + ' Redirecting...');
        
        sessionStorage.removeItem('refCode');
        setTimeout(() => window.location.href = '/dashboard', 1500);
      } catch (e) {
        showError('❌ ' + e.message);
        btn.disabled = false;
        btn.textContent = origText;
      }
    }
    
    // Load content
    loadContent();
  </script>
</body>
</html>
