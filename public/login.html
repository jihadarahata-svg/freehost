<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — FreeHost</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    background: #0a0a0f;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow: hidden;
  }
  
  body::before {
    content: '';
    position: fixed;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    width: 900px;
    height: 700px;
    background: radial-gradient(ellipse at center, rgba(139,92,246,0.2), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  
  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    background: linear-gradient(180deg, #101018 0%, #0d0d14 100%);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 36px 28px;
    box-shadow: 0 40px 80px -20px rgba(0,0,0,0.9);
  }
  
  .logo {
    width: 60px;
    height: 60px;
    margin: 0 auto 18px;
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    box-shadow: 0 12px 30px -8px rgba(139,92,246,0.6);
  }
  
  h1 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    text-align: center;
    margin-bottom: 6px;
  }
  
  .sub {
    text-align: center;
    color: #a1a1aa;
    font-size: 13px;
    margin-bottom: 26px;
  }
  
  /* Tabs */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 22px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 4px;
  }
  .tab {
    flex: 1;
    padding: 11px;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: #a1a1aa;
    cursor: pointer;
    border-radius: 8px;
    transition: 0.2s;
  }
  .tab.active {
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    color: #fff;
    box-shadow: 0 6px 15px -5px rgba(139,92,246,0.5);
  }
  
  /* Form */
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12px;
    color: #a1a1aa;
    margin-bottom: 6px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .field input {
    width: 100%;
    padding: 14px 16px;
    background: rgba(0,0,0,0.4);
    border: 1.5px solid rgba(255,255,255,0.08);
    border-radius: 11px;
    color: #fff;
    font-size: 14px;
    outline: none;
    font-family: inherit;
    transition: 0.2s;
  }
  .field input:focus {
    border-color: rgba(139,92,246,0.6);
    background: rgba(139,92,246,0.05);
    box-shadow: 0 0 0 4px rgba(139,92,246,0.1);
  }
  .field input::placeholder { color: #52525b; }
  
  .btn {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    transition: 0.2s;
    font-family: inherit;
    margin-top: 8px;
    box-shadow: 0 12px 30px -8px rgba(139,92,246,0.5);
  }
  .btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 20px 40px -8px rgba(139,92,246,0.7);
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  
  /* Messages */
  .message {
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 14px;
    display: none;
    font-weight: 600;
  }
  .message.show { display: block; }
  .message.error {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    color: #f87171;
  }
  .message.success {
    background: rgba(16,185,129,0.1);
    border: 1px solid rgba(16,185,129,0.3);
    color: #34d399;
  }
  
  .form { display: none; }
  .form.active { display: block; animation: fadeIn 0.3s; }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .back-link {
    display: block;
    text-align: center;
    margin-top: 22px;
    color: #a1a1aa;
    font-size: 13px;
    text-decoration: none;
    transition: 0.2s;
  }
  .back-link:hover { color: #fff; }
  
  .terms {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid rgba(255,255,255,0.06);
    font-size: 11px;
    color: #52525b;
    text-align: center;
    line-height: 1.6;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="logo">◆</div>
    <h1>Welcome to FreeHost</h1>
    <p class="sub">Sign in or create account to continue</p>

    <!-- Tabs -->
    <div class="tabs">
      <div class="tab active" id="tabLogin" onclick="showForm('login')">Sign In</div>
      <div class="tab" id="tabSignup" onclick="showForm('signup')">Sign Up</div>
    </div>

    <!-- Messages -->
    <div class="message error" id="errorMsg"></div>
    <div class="message success" id="successMsg"></div>

    <!-- LOGIN FORM -->
    <div class="form active" id="loginForm">
      <div class="field">
        <label>Email</label>
        <input id="loginEmail" type="email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label>Password</label>
        <input id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password" onkeypress="if(event.key==='Enter') doLogin()">
      </div>
      <button class="btn" id="loginBtn" onclick="doLogin()">Sign In</button>
    </div>

    <!-- SIGNUP FORM -->
    <div class="form" id="signupForm">
      <div class="field">
        <label>Full Name</label>
        <input id="signupName" type="text" placeholder="Your name" autocomplete="name">
      </div>
      <div class="field">
        <label>Email</label>
        <input id="signupEmail" type="email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label>Password</label>
        <input id="signupPassword" type="password" placeholder="কমপক্ষে ৬ character" autocomplete="new-password" onkeypress="if(event.key==='Enter') doSignup()">
      </div>
      <button class="btn" id="signupBtn" onclick="doSignup()">Create Account</button>
    </div>

    <a href="/" class="back-link" id="backLink">← Back to home</a>

    <div class="terms">
      By signing up, you agree to our <a href="#" style="color:#71717a;">Terms</a> and <a href="#" style="color:#71717a;">Privacy Policy</a>
    </div>
  </div>

  <script>
    // Redirect target নেওয়া URL থেকে
    const params = new URLSearchParams(window.location.search);
    const redirectTo = params.get('redirect') || '/dashboard';
    const errorParam = params.get('error');

    // Back link এ redirect path যোগ করো
    const backLink = document.getElementById('backLink');
    if (redirectTo === '/shop') {
      backLink.href = '/';
      backLink.textContent = '← Back to home';
    }

    // Error message দেখাও
    if (errorParam) {
      showError('Login failed. Please try again.');
    }

    // Default tab = signup (যদি নতুন user হয়)
    const mode = params.get('mode');
    if (mode === 'signup') {
      showForm('signup');
    }

    function showForm(form) {
      document.getElementById('errorMsg').classList.remove('show');
      document.getElementById('successMsg').classList.remove('show');
      
      if (form === 'login') {
        document.getElementById('loginForm').classList.add('active');
        document.getElementById('signupForm').classList.remove('active');
        document.getElementById('tabLogin').classList.add('active');
        document.getElementById('tabSignup').classList.remove('active');
      } else {
        document.getElementById('loginForm').classList.remove('active');
        document.getElementById('signupForm').classList.add('active');
        document.getElementById('tabLogin').classList.remove('active');
        document.getElementById('tabSignup').classList.add('active');
      }
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = '❌ ' + msg;
      el.classList.add('show');
      document.getElementById('successMsg').classList.remove('show');
    }

    function showSuccess(msg) {
      const el = document.getElementById('successMsg');
      el.textContent = '✅ ' + msg;
      el.classList.add('show');
      document.getElementById('errorMsg').classList.remove('show');
    }

    async function doLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) return showError('Email ও Password দিন');

      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error);

        showSuccess('Login successful! Redirecting...');
        setTimeout(() => window.location.href = redirectTo, 500);
      } catch (e) {
        showError(e.message);
      }

      btn.disabled = false;
      btn.textContent = 'Sign In';
    }

    async function doSignup() {
      const name = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;

      if (!name || !email || !password) return showError('সব field পূরণ করুন');
      if (password.length < 6) return showError('Password কমপক্ষে ৬ character');

      const btn = document.getElementById('signupBtn');
      btn.disabled = true;
      btn.textContent = 'Creating account...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error);

        showSuccess('Account created! Redirecting...');
        setTimeout(() => window.location.href = redirectTo, 500);
      } catch (e) {
        showError(e.message);
      }

      btn.disabled = false;
      btn.textContent = 'Create Account';
    }
  </script>
</body>
</html>
