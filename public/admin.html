<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — FreeHost</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0a0a0f; color: #fff; padding: 16px; min-height: 100vh; }
  
  .login { max-width: 400px; margin: 80px auto; background: #151515; border: 1px solid #222; border-radius: 16px; padding: 24px; }
  h1 { font-size: 22px; margin-bottom: 16px; }
  input { width: 100%; padding: 12px; background: #0a0a0a; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 14px; }
  button { padding: 12px 18px; background: #fff; color: #000; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 12px; font-family: inherit; }
  button.full { width: 100%; }
  button.red { background: #dc2626; color: #fff; padding: 6px 10px; font-size: 12px; margin: 0; }
  button.sm { padding: 6px 10px; font-size: 12px; margin: 0; background: #222; color: #fff; }
  button.green { background: #16a34a; color: #fff; padding: 6px 10px; font-size: 12px; margin: 0; }
  button.blue { background: #2563eb; color: #fff; padding: 6px 10px; font-size: 12px; margin: 0; }
  
  #dash { display: none; }
  #dash.show { display: block; }
  
  .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
  .stats { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .card { flex: 1; min-width: 120px; background: #151515; border: 1px solid #222; border-radius: 12px; padding: 16px; }
  .num { font-size: 26px; font-weight: 700; color: #4ade80; }
  .lbl { font-size: 11px; color: #888; margin-top: 2px; }
  
  .search-bar { display: flex; gap: 8px; margin-bottom: 16px; }
  .search-bar input { flex: 1; padding: 12px; }
  
  .page-item { background: #151515; border: 1px solid #222; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .page-item h3 { font-size: 15px; margin-bottom: 6px; }
  .page-item .link { color: #4ade80; font-size: 12px; word-break: break-all; display: block; margin-bottom: 8px; text-decoration: none; }
  .page-item .link:hover { text-decoration: underline; }
  .page-item .meta { font-size: 11px; color: #888; margin-bottom: 10px; }
  .page-item .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .empty { text-align: center; color: #666; padding: 40px; font-size: 14px; }
  
  .code-box { display: none; margin-top: 12px; background: #000; border: 1px solid #333; border-radius: 8px; padding: 12px; max-height: 400px; overflow: auto; }
  .code-box.show { display: block; }
  .code-box pre { font-family: 'Courier New', monospace; font-size: 11px; color: #4ade80; white-space: pre-wrap; word-break: break-all; margin: 0; }
  
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #16a34a; color: #fff;
    padding: 12px 24px; border-radius: 10px;
    font-size: 14px; font-weight: 600;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    transition: transform 0.3s ease; z-index: 9999;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  
  .user-card { background: #151515; border: 1px solid #222; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .user-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .user-photo { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #333; }
  .user-photo-placeholder { width: 40px; height: 40px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .user-name { font-weight: 600; font-size: 14px; }
  .user-email { font-size: 12px; color: #888; }
  
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.85);
    display: none; align-items: center; justify-content: center;
    z-index: 1000; padding: 16px;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #151515; border: 1px solid #333;
    border-radius: 16px; padding: 24px;
    width: 100%; max-width: 800px;
    max-height: 90vh; overflow: auto;
  }
  .modal-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; padding-bottom: 16px;
    border-bottom: 1px solid #222;
  }
  .modal-head h2 { font-size: 18px; font-weight: 700; }
  .modal-close { background: transparent; color: #888; border: none; font-size: 24px; cursor: pointer; padding: 4px 12px; margin: 0; border-radius: 6px; }
  .modal-close:hover { background: #222; color: #fff; }
  .modal-field { margin-bottom: 14px; }
  .modal-field label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
  .modal-field input, .modal-field textarea {
    width: 100%; padding: 12px;
    background: #0a0a0a; border: 1px solid #333;
    border-radius: 8px; color: #fff;
    font-size: 14px; font-family: inherit; outline: none;
  }
  .modal-field input:focus, .modal-field textarea:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }
  .modal-field textarea {
    font-family: 'Courier New', monospace;
    font-size: 13px; min-height: 300px; resize: vertical;
  }
  .modal-btns { display: flex; gap: 8px; margin-top: 16px; padding-top: 16px; border-top: 1px solid #222; }
  .modal-btns button { flex: 1; margin: 0; }
</style>
</head>
<body>

  <!-- LOGIN -->
  <div class="login" id="login">
    <h1>🔐 Admin Login</h1>
    <input id="pass" type="password" placeholder="Password" onkeypress="if(event.key==='Enter') doLogin()">
    <button class="full" onclick="doLogin()">Login</button>
    <p id="err" style="color:#f87171;font-size:13px;margin-top:10px"></p>
  </div>

  <!-- DASHBOARD -->
  <div id="dash">
    <div class="head">
      <h1 style="font-size:20px">📊 Admin Panel</h1>
      <div>
        <button class="sm" onclick="showTab('pages')" id="tabPages" style="background:#2563eb;">📄 Pages</button>
        <button class="sm" onclick="showTab('users')" id="tabUsers">👥 Users</button>
        <button class="sm" onclick="load()">🔄 Refresh</button>
        <button class="sm" onclick="logout()">Logout</button>
      </div>
    </div>

    <div class="stats">
      <div class="card"><div class="num" id="tp">0</div><div class="lbl">Total Pages</div></div>
      <div class="card"><div class="num" id="tv">0</div><div class="lbl">Total Views</div></div>
      <div class="card"><div class="num" id="tu">0</div><div class="lbl">Total Users</div></div>
    </div>

    <div id="pagesTab">
      <div class="search-bar">
        <input id="searchInput" type="text" placeholder="🔍 Search pages..." oninput="filterPages()">
      </div>
      <div id="list"><div class="empty">Loading...</div></div>
    </div>

    <div id="usersTab" style="display:none;">
      <div class="search-bar">
        <input id="userSearchInput" type="text" placeholder="🔍 Search users..." oninput="filterUsers()">
      </div>
      <div id="userList"><div class="empty">Loading...</div></div>
    </div>
  </div>

  <!-- EDIT MODAL -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <div class="modal-head">
        <h2>📝 Edit Page</h2>
        <button class="modal-close" onclick="closeEditModal()">✕</button>
      </div>
      <div class="modal-field">
        <label>Page Title</label>
        <input id="editTitle" placeholder="My Page">
      </div>
      <div class="modal-field">
        <label>HTML Code</label>
        <textarea id="editHtml" placeholder="<h1>Hello World</h1>"></textarea>
      </div>
      <div class="modal-field">
        <label>Password (leave empty to remove)</label>
        <input id="editPassword" type="password" placeholder="Optional">
      </div>
      <div class="modal-btns">
        <button class="sm" onclick="closeEditModal()">Cancel</button>
        <button class="blue" onclick="saveEdit()" id="saveEditBtn">💾 Save Changes</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let token = localStorage.getItem('adm_token');
    let allPages = [];
    let allUsers = [];
    let currentTab = 'pages';
    let editingId = null;

    if (token) showDash();

    async function doLogin() {
      const password = document.getElementById('pass').value;
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });
      const data = await res.json();
      if (data.success) {
        token = data.token;
        localStorage.setItem('adm_token', token);
        showDash();
      } else {
        document.getElementById('err').textContent = '❌ ভুল পাসওয়ার্ড';
      }
    }

    function logout() {
      localStorage.removeItem('adm_token');
      location.reload();
    }

    function showDash() {
      document.getElementById('login').style.display = 'none';
      document.getElementById('dash').classList.add('show');
      load();
    }

    function showToast(msg, color) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.background = color || '#16a34a';
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function showTab(tab) {
      currentTab = tab;
      document.getElementById('pagesTab').style.display = tab === 'pages' ? 'block' : 'none';
      document.getElementById('usersTab').style.display = tab === 'users' ? 'block' : 'none';
      document.getElementById('tabPages').style.background = tab === 'pages' ? '#2563eb' : '#222';
      document.getElementById('tabUsers').style.background = tab === 'users' ? '#2563eb' : '#222';
      if (tab === 'users' && allUsers.length === 0) loadUsers();
    }

    async function load() {
      const h = { 'x-admin-token': token };
      const pRes = await fetch('/api/admin/list-full', { headers: h });
      const sRes = await fetch('/api/admin/stats', { headers: h });
      if (pRes.status === 401) return logout();

      allPages = await pRes.json();
      const stats = await sRes.json();

      document.getElementById('tp').textContent = stats.totalPages;
      document.getElementById('tv').textContent = stats.totalViews;
      document.getElementById('tu').textContent = stats.totalUsers || 0;

      renderPages(allPages);
    }

    async function loadUsers() {
      try {
        const res = await fetch('/api/admin/list-users', {
          headers: { 'x-admin-token': token }
        });
        if (res.status === 401) return logout();
        allUsers = await res.json();
        renderUsers(allUsers);
      } catch (e) {
        document.getElementById('userList').innerHTML = '<div class="empty">Failed to load</div>';
      }
    }

    function filterPages() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!q) return renderPages(allPages);
      const filtered = allPages.filter(p =>
        (p.title || '').toLowerCase().includes(q) ||
        (p._id || '').toLowerCase().includes(q)
      );
      renderPages(filtered);
    }

    function filterUsers() {
      const q = document.getElementById('userSearchInput').value.toLowerCase().trim();
      if (!q) return renderUsers(allUsers);
      const filtered = allUsers.filter(u =>
        (u.email || '').toLowerCase().includes(q) ||
        (u.name || '').toLowerCase().includes(q)
      );
      renderUsers(filtered);
    }

    function renderPages(pages) {
      const list = document.getElementById('list');
      if (!pages.length) {
        list.innerHTML = '<div class="empty">কোনো page নেই</div>';
        return;
      }
      list.innerHTML = pages.map(function(p) {
        const safeHtml = esc(p.html || '');
        const bannedBadge = p.banned ? ' · ⛔ BANNED' : '';
        return '<div class="page-item">' +
          '<h3>' + esc(p.title) + '</h3>' +
          '<a class="link" href="/p/' + p._id + '" target="_blank">/p/' + p._id + '</a>' +
          '<div class="meta">👁 ' + p.views + ' views · ' + new Date(p.createdAt).toLocaleString('bn-BD') + (p.password ? ' · 🔒 Locked' : '') + bannedBadge + '</div>' +
          '<div class="btns">' +
            '<button class="blue" onclick="openEditModal(\'' + p._id + '\')">📝 Edit</button>' +
            '<button class="green" onclick="toggleCode(\'' + p._id + '\')">📄 View Code</button>' +
            '<button class="sm" onclick="copy(\'' + p._id + '\')">🔗 Copy Link</button>' +
            '<button class="sm" onclick="copyCode(\'' + p._id + '\')">📋 Copy Code</button>' +
            '<button class="blue" onclick="downloadCode(\'' + p._id + '\', \'' + esc(p.title) + '\')">📥 Download</button>' +
            '<button class="red" onclick="del(\'' + p._id + '\', \'' + esc(p.title) + '\')">🗑 Delete</button>' +
          '</div>' +
          '<div class="code-box" id="code-' + p._id + '">' +
            '<pre>' + safeHtml + '</pre>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function renderUsers(users) {
      const list = document.getElementById('userList');
      if (!users.length) {
        list.innerHTML = '<div class="empty">কোনো user নেই</div>';
        return;
      }
      list.innerHTML = users.map(function(u) {
        const banned = u.banned ? '<span style="color:#f87171;font-weight:600;">⛔ BANNED</span>' : '<span style="color:#4ade80;">● Active</span>';
        const photo = u.photo 
          ? '<img src="' + esc(u.photo) + '" class="user-photo" onerror="this.style.display=\'none\'">' 
          : '<div class="user-photo-placeholder">👤</div>';
        const banBtn = u.banned 
          ? '<button class="green" onclick="banUser(\'' + u._id + '\', false)">✅ Unban</button>'
          : '<button class="red" onclick="banUser(\'' + u._id + '\', true)">🚫 Ban</button>';
        
        return '<div class="user-card">' +
          '<div class="user-head">' + photo +
            '<div>' +
              '<div class="user-name">' + esc(u.name || 'User') + '</div>' +
              '<div class="user-email">' + esc(u.email) + '</div>' +
            '</div>' +
          '</div>' +
          '<div style="font-size:11px;color:#888;margin-bottom:10px;">' + banned + ' · Joined ' + new Date(u.createdAt).toLocaleDateString() + '</div>' +
          '<div class="btns">' + banBtn +
            '<button class="red" onclick="deleteUser(\'' + u._id + '\', \'' + esc(u.email) + '\')">🗑 Delete</button>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function toggleCode(id) {
      const box = document.getElementById('code-' + id);
      box.classList.toggle('show');
    }

    function copy(id) {
      const url = location.origin + '/p/' + id;
      navigator.clipboard.writeText(url);
      showToast('✅ Link copied!');
    }

    function copyCode(id) {
      const page = allPages.find(function(p) { return p._id === id; });
      if (page && page.html) {
        navigator.clipboard.writeText(page.html);
        showToast('✅ HTML copied!');
      }
    }

    function downloadCode(id, title) {
      const page = allPages.find(function(p) { return p._id === id; });
      if (!page || !page.html) return showToast('❌ No code', '#dc2626');
      const blob = new Blob([page.html], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = (title || id).replace(/[^a-z0-9]/gi, '-').toLowerCase() + '.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('✅ Downloaded!');
    }

    // ✏️ EDIT FUNCTIONS
    function openEditModal(id) {
      const page = allPages.find(function(p) { return p._id === id; });
      if (!page) return showToast('❌ Page not found', '#dc2626');
      
      editingId = id;
      document.getElementById('editTitle').value = page.title || '';
      document.getElementById('editHtml').value = page.html || '';
      document.getElementById('editPassword').value = '';
      document.getElementById('editModal').classList.add('show');
    }

    function closeEditModal() {
      editingId = null;
      document.getElementById('editModal').classList.remove('show');
    }

    async function saveEdit() {
      if (!editingId) return;
      
      const btn = document.getElementById('saveEditBtn');
      const title = document.getElementById('editTitle').value;
      const html = document.getElementById('editHtml').value;
      const password = document.getElementById('editPassword').value;
      
      if (!html.trim()) {
        showToast('❌ HTML required', '#dc2626');
        return;
      }
      
      btn.disabled = true;
      btn.textContent = '💾 Saving...';
      
      try {
        const body = { title: title || 'Untitled', html: html };
        if (password) body.password = password;
        
        const res = await fetch('/api/admin/page/' + editingId, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-token': token
          },
          body: JSON.stringify(body)
        });
        
        if (!res.ok) throw new Error('Failed');
        
        showToast('✅ Saved! Link updated.');
        closeEditModal();
        load();
      } catch (e) {
        showToast('❌ Save failed', '#dc2626');
      }
      
      btn.disabled = false;
      btn.textContent = '💾 Save Changes';
    }

    async function banUser(id, ban) {
      if (ban && !confirm('এই user কে ban করলে তার সব page বন্ধ হবে। Ban করবে?')) return;
      try {
        const res = await fetch('/api/admin/user/' + id + '/ban', {
          method: 'PUT',
          headers: { 
            'Content-Type': 'application/json',
            'x-admin-token': token 
          },
          body: JSON.stringify({ banned: ban })
        });
        if (!res.ok) throw new Error('Failed');
        showToast(ban ? '🚫 User banned' : '✅ User unbanned');
        loadUsers();
      } catch (e) {
        showToast('❌ Failed', '#dc2626');
      }
    }

    async function deleteUser(id, email) {
      if (!confirm('"' + email + '" এর account ডিলিট করবে?')) return;
      try {
        const res = await fetch('/api/admin/user/' + id, {
          method: 'DELETE',
          headers: { 'x-admin-token': token }
        });
        if (!res.ok) throw new Error('Failed');
        showToast('🗑 User deleted');
        loadUsers();
      } catch (e) {
        showToast('❌ Failed', '#dc2626');
      }
    }

    async function del(id, title) {
      if (!confirm('"' + title + '" ডিলিট করবে?')) return;
      await fetch('/api/admin/delete/' + id, {
        method: 'DELETE',
        headers: { 'x-admin-token': token }
      });
      showToast('🗑 Deleted');
      load();
    }

    function esc(s) {
      return String(s || '').replace(/[&<>"]/g, function(c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }
  </script>
</body>
</html>
