<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — FreeHost</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f0f14; color: #fff; min-height: 100vh; }
  
  .topbar {
    background: linear-gradient(135deg, #7c3aed, #ec4899);
    padding: 12px 20px; text-align: center;
    font-size: 13px; font-weight: 600;
  }
  
  .nav {
    background: #1a1a22; padding: 16px 20px;
    display: flex; align-items: center; gap: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    position: sticky; top: 0; z-index: 100;
  }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; white-space: nowrap; }
  .logo-mark {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, #f59e0b, #ec4899);
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .search-bar { flex: 1; max-width: 500px; position: relative; }
  .search-bar input {
    width: 100%; padding: 12px 16px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; color: #fff;
    font-size: 14px; outline: none;
  }
  .nav-icons { display: flex; align-items: center; gap: 16px; margin-left: auto; }
  .nav-icon {
    display: flex; flex-direction: column; align-items: center;
    gap: 2px; font-size: 10px; color: #a1a1aa;
    cursor: pointer; font-weight: 600; text-decoration: none;
  }
  .nav-icon .emoji { font-size: 20px; }
  .cart-badge {
    background: #ef4444; color: #fff; font-size: 10px;
    padding: 1px 6px; border-radius: 10px;
    position: relative; top: -8px; right: 6px;
  }
  @media (max-width: 700px) {
    .nav { flex-wrap: wrap; }
    .nav-icons { margin-left: 0; }
  }
  
  .banner {
    margin: 20px; padding: 40px 24px;
    background: linear-gradient(135deg, #7c3aed, #6366f1, #06b6d4);
    border-radius: 20px; text-align: center;
    position: relative; overflow: hidden;
  }
  .banner::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 30% 50%, rgba(255,255,255,0.15), transparent 50%);
  }
  .banner-content { position: relative; z-index: 1; }
  .banner-badge {
    display: inline-block; padding: 5px 14px;
    background: rgba(255,255,255,0.2);
    border-radius: 20px; font-size: 12px;
    margin-bottom: 12px; font-weight: 700;
  }
  .banner h1 { font-size: clamp(24px, 4vw, 36px); font-weight: 900; letter-spacing: -1px; margin-bottom: 8px; }
  .banner p { font-size: 14px; opacity: 0.95; margin-bottom: 20px; }
  .banner-btn {
    padding: 12px 28px; background: #fff;
    color: #7c3aed; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 800; cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  
  .container { padding: 0 20px 60px; max-width: 1200px; margin: 0 auto; }
  
  .cat-scroll {
    display: flex; gap: 12px; overflow-x: auto;
    padding: 20px 0; margin-bottom: 20px;
  }
  .cat-scroll::-webkit-scrollbar { display: none; }
  .cat-card {
    min-width: 90px; padding: 16px 12px;
    background: #1a1a22;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px; text-align: center;
    cursor: pointer; flex-shrink: 0;
    transition: 0.2s;
  }
  .cat-card:hover { border-color: rgba(139,92,246,0.5); transform: translateY(-3px); }
  .cat-card.active { background: linear-gradient(135deg, #8b5cf6, #6366f1); border-color: transparent; }
  .cat-emoji { font-size: 28px; margin-bottom: 6px; display: block; }
  .cat-name { font-size: 12px; font-weight: 700; color: #e4e4e7; }
  
  .sec-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; padding-top: 20px;
  }
  .sec-head h2 { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .see-all { color: #8b5cf6; font-size: 13px; font-weight: 600; cursor: pointer; }
  
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 14px; margin-bottom: 30px;
  }
  .product {
    background: #1a1a22;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px; overflow: hidden;
    transition: 0.25s; cursor: pointer;
  }
  .product:hover {
    transform: translateY(-4px);
    border-color: rgba(139,92,246,0.4);
    box-shadow: 0 20px 40px -15px rgba(139,92,246,0.4);
  }
  .prod-img {
    width: 100%; aspect-ratio: 1;
    background: linear-gradient(135deg, #2a1a4a, #1a1a3e);
    display: flex; align-items: center; justify-content: center;
    font-size: 60px; position: relative;
  }
  .prod-img img { width: 100%; height: 100%; object-fit: cover; }
  .prod-discount {
    position: absolute; top: 8px; right: 8px;
    background: #ef4444; color: #fff;
    padding: 4px 8px; border-radius: 6px;
    font-size: 10px; font-weight: 800;
  }
  .prod-body { padding: 12px; }
  .prod-title {
    font-size: 13px; font-weight: 700;
    margin-bottom: 6px; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
    min-height: 34px;
  }
  .prod-price-row { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; }
  .prod-price { font-size: 16px; font-weight: 800; color: #f59e0b; }
  .prod-old { font-size: 11px; color: #71717a; text-decoration: line-through; }
  .prod-rating { font-size: 10px; color: #a1a1aa; margin-bottom: 8px; }
  .prod-btn {
    width: 100%; padding: 9px;
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    color: #fff; border: none; border-radius: 8px;
    font-size: 12px; font-weight: 700;
    cursor: pointer;
  }
  .prod-btn:hover { box-shadow: 0 8px 20px -5px rgba(139,92,246,0.6); }
  
  .wallet-float {
    position: fixed; bottom: 24px; right: 24px;
    background: linear-gradient(135deg, #10b981, #059669);
    color: #fff; padding: 14px 20px;
    border-radius: 40px; font-weight: 700;
    font-size: 14px; box-shadow: 0 15px 40px -10px rgba(16,185,129,0.6);
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; z-index: 50;
    text-decoration: none;
  }
  
  .empty {
    text-align: center; padding: 60px 20px;
    color: #71717a; font-size: 14px;
  }
  .empty-icon { font-size: 60px; margin-bottom: 16px; opacity: 0.6; display: block; }
  .empty-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; color: #e4e4e7; }
  
  .loading {
    text-align: center; padding: 60px;
    color: #71717a; font-size: 14px;
  }
</style>
</head>
<body>

  <div class="topbar" id="topbar">🎉 স্পেশাল অফার: সব প্রোডাক্টে ২০% ছাড়!</div>

  <nav class="nav">
    <a href="/" class="logo" style="text-decoration:none;color:#fff;">
      <div class="logo-mark">🛍</div>
      <span id="logoText">FreeHost Shop</span>
    </a>
    <div class="search-bar">
      <input id="searchInput" placeholder="🔍 কী খুঁজছেন?" oninput="filterProducts()">
    </div>
    <div class="nav-icons">
      <a href="/wallet" class="nav-icon">
        <span class="emoji">💰</span>
        <span id="walletAmt">৳0</span>
      </a>
      <a href="/wallet" class="nav-icon">
        <span class="emoji">📦</span>
        <span id="ordersBtnText">Orders</span>
      </a>
      <a href="/dashboard" class="nav-icon">
        <span class="emoji">👤</span>
        <span id="meBtnText">Me</span>
      </a>
    </div>
  </nav>

  <div class="banner">
    <div class="banner-content">
      <div class="banner-badge" id="heroBadge">🔥 Limited Time</div>
      <h1 id="heroHeading">HTML Templates Mega Pack</h1>
      <p id="heroSubtitle">৫০টা প্রিমিয়াম টেমপ্লেট — মাত্র ৳১০০</p>
      <button class="banner-btn" id="heroButton" onclick="scrollToProducts()">এখনই কিনুন →</button>
    </div>
  </div>

  <div class="container">
    
    <div class="cat-scroll" id="catScroll">
      <div class="cat-card active" onclick="filterCat('all', this)">
        <span class="cat-emoji">🛍</span>
        <div class="cat-name">সব</div>
      </div>
    </div>

    <div class="sec-head">
      <h2 id="allProductsTitle">📦 All Products</h2>
      <span class="see-all" id="seeAllText" onclick="scrollToProducts()">See all →</span>
    </div>
    
    <div id="productsList">
      <div class="loading">Loading products...</div>
    </div>
  </div>

  <a href="/wallet" class="wallet-float">
    💰 <span id="floatWallet">৳0</span>
  </a>

  <script>
    let allProducts = [];
    let content = {};

    async function loadContent() {
      try {
        const res = await fetch('/api/content');
        content = await res.json();
        const s = content.shop || {};
        
        if (s.logoText) document.getElementById('logoText').textContent = s.logoText;
        if (s.searchPlaceholder) document.getElementById('searchInput').placeholder = s.searchPlaceholder;
        if (s.ordersBtn) document.getElementById('ordersBtnText').textContent = s.ordersBtn;
        if (s.meBtn) document.getElementById('meBtnText').textContent = s.meBtn;
        if (s.heroBadge) document.getElementById('heroBadge').textContent = s.heroBadge;
        if (s.heroHeading) document.getElementById('heroHeading').textContent = s.heroHeading;
        if (s.heroSubtitle) document.getElementById('heroSubtitle').textContent = s.heroSubtitle;
        if (s.heroButton) document.getElementById('heroButton').textContent = s.heroButton;
        if (s.allProductsTitle) document.getElementById('allProductsTitle').textContent = s.allProductsTitle;
        if (s.seeAllText) document.getElementById('seeAllText').textContent = s.seeAllText;
        
        // Page title
        if (s.logoText) document.title = s.logoText + ' — Shop';
      } catch (e) {
        console.error('Content load failed:', e);
      }
    }

    async function loadUser() {
      try {
        const res = await fetch('/api/me');
        if (!res.ok) return;
        const user = await res.json();
        document.getElementById('walletAmt').textContent = '৳' + (user.wallet || 0);
        document.getElementById('floatWallet').textContent = '৳' + (user.wallet || 0);
      } catch (e) {}
    }

    async function loadProducts() {
      try {
        const res = await fetch('/api/shop/products');
        allProducts = await res.json();
        renderProducts(allProducts);
      } catch (e) {
        document.getElementById('productsList').innerHTML = '<div class="empty"><span class="empty-icon">⚠️</span><div class="empty-title">Failed to load products</div></div>';
      }
    }

    async function loadCategories() {
      try {
        const res = await fetch('/api/shop/categories');
        const cats = await res.json();
        const scroll = document.getElementById('catScroll');
        const icons = { 'Templates': '🎨', 'Code': '💻', 'Design': '🎯', 'Books': '📚', 'Video': '🎬', 'Other': '📦' };
        
        scroll.innerHTML = '<div class="cat-card active" onclick="filterCat(\'all\', this)"><span class="cat-emoji">🛍</span><div class="cat-name">সব</div></div>' +
          cats.map(c => 
            '<div class="cat-card" onclick="filterCat(\'' + esc(c) + '\', this)">' +
              '<span class="cat-emoji">' + (icons[c] || '📦') + '</span>' +
              '<div class="cat-name">' + esc(c) + '</div>' +
            '</div>'
          ).join('');
      } catch (e) {}
    }

    function filterCat(cat, el) {
      document.querySelectorAll('.cat-card').forEach(c => c.classList.remove('active'));
      if (el) el.classList.add('active');
      if (cat === 'all') return renderProducts(allProducts);
      renderProducts(allProducts.filter(p => p.category === cat));
    }

    function filterProducts() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!q) return renderProducts(allProducts);
      renderProducts(allProducts.filter(p => 
        (p.title || '').toLowerCase().includes(q) || 
        (p.description || '').toLowerCase().includes(q)
      ));
    }

    function renderProducts(products) {
      const list = document.getElementById('productsList');
      if (!products.length) {
        list.innerHTML = '<div class="empty"><span class="empty-icon">📦</span><div class="empty-title">' + (content.shop?.noProductsText || 'No products found') + '</div></div>';
        return;
      }
      
      const buyText = content.shop?.buyNowText || 'Buy Now';
      
      list.innerHTML = '<div class="grid">' + products.map(p => {
        const photo = p.photo 
          ? '<img src="' + esc(p.photo) + '" onerror="this.style.display=\'none\';this.parentElement.textContent=\'📦\'">'
          : '📦';
        const discount = p.discountPrice ? Math.round((1 - p.discountPrice / p.price) * 100) : 0;
        
        return '<div class="product" onclick="openProduct(\'' + p._id + '\')">' +
          '<div class="prod-img">' + photo +
            (discount > 0 ? '<div class="prod-discount">-' + discount + '%</div>' : '') +
          '</div>' +
          '<div class="prod-body">' +
            '<div class="prod-title">' + esc(p.title) + '</div>' +
            '<div class="prod-price-row">' +
              '<span class="prod-price">৳' + (p.discountPrice || p.price) + '</span>' +
              (p.discountPrice ? '<span class="prod-old">৳' + p.price + '</span>' : '') +
            '</div>' +
            '<div class="prod-rating">' + (p.sold || 0) + ' sold</div>' +
            '<button class="prod-btn">' + buyText + '</button>' +
          '</div>' +
        '</div>';
      }).join('') + '</div>';
    }

    function openProduct(id) {
      window.location.href = '/product/' + id;
    }

    function scrollToProducts() {
      document.getElementById('productsList').scrollIntoView({ behavior: 'smooth' });
    }

    function esc(s) {
      return String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    async function init() {
      await loadContent();
      await loadUser();
      await loadCategories();
      await loadProducts();
    }
    init();
  </script>
</body>
</html>
