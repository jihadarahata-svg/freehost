<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — FreeHost</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0f0f14; color: #fff; min-height: 100vh;
  }
  
  .nav {
    background: #1a1a22; padding: 14px 20px;
    display: flex; align-items: center; gap: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    position: sticky; top: 0; z-index: 100;
  }
  .back-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    color: #fff; text-decoration: none;
    font-size: 13px; font-weight: 700;
    cursor: pointer; transition: 0.2s;
  }
  .back-btn:hover {
    background: rgba(139,92,246,0.2);
    border-color: rgba(139,92,246,0.5);
  }
  .nav h1 {
    font-size: 17px; font-weight: 800;
    display: flex; align-items: center; gap: 8px;
  }
  .nav-actions {
    margin-left: auto;
    display: flex; gap: 8px;
    flex-wrap: wrap;
  }
  .nav-action-btn {
    padding: 8px 14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: #a1a1aa;
    font-size: 12px; font-weight: 700;
    cursor: pointer; font-family: inherit;
    transition: 0.2s;
  }
  .nav-action-btn:hover {
    background: rgba(139,92,246,0.15);
    color: #c4b5fd;
    border-color: rgba(139,92,246,0.4);
  }
  .nav-action-btn.danger:hover {
    background: rgba(239,68,68,0.15);
    color: #f87171;
    border-color: rgba(239,68,68,0.4);
  }
  
  .container { max-width: 700px; margin: 0 auto; padding: 20px; }
  
  .stats-bar {
    display: flex; gap: 12px;
    margin-bottom: 20px; flex-wrap: wrap;
  }
  .stat-chip {
    padding: 10px 16px;
    background: #1a1a22;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    font-size: 13px;
    display: flex; align-items: center; gap: 6px;
  }
  .stat-chip strong {
    color: #c4b5fd;
    font-size: 15px;
  }
  
  .notif-item {
    background: #1a1a22;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 10px;
    display: flex; gap: 14px;
    align-items: flex-start;
    transition: 0.2s;
    cursor: pointer;
    position: relative;
  }
  .notif-item:hover {
    border-color: rgba(139,92,246,0.3);
    background: #1e1e28;
  }
  .notif-item.unread {
    background: linear-gradient(180deg, rgba(139,92,246,0.08), rgba(139,92,246,0.03));
    border-color: rgba(139,92,246,0.3);
  }
  .notif-item.unread::before {
    content: '';
    position: absolute;
    top: 16px; left: -4px;
    width: 8px; height: 8px;
    background: #8b5cf6;
    border-radius: 50%;
    box-shadow: 0 0 10px #8b5cf6;
  }
  .notif-icon {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, rgba(139,92,246,0.15), rgba(99,102,241,0.15));
    border: 1px solid rgba(139,92,246,0.3);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .notif-body { flex: 1; min-width: 0; }
  .notif-title {
    font-size: 15px; font-weight: 800;
    margin-bottom: 4px;
    letter-spacing: -0.2px;
  }
  .notif-msg {
    font-size: 13px; color: #a1a1aa;
    line-height: 1.5;
    margin-bottom: 6px;
    word-break: break-word;
  }
  .notif-time {
    font-size: 11px; color: #52525b;
    display: flex; align-items: center; gap: 6px;
  }
  .notif-delete {
    padding: 6px 10px;
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.25);
    border-radius: 8px;
    color: #f87171;
    font-size: 11px; font-weight: 700;
    cursor: pointer; font-family: inherit;
    transition: 0.15s;
    opacity: 0.7;
  }
  .notif-delete:hover {
    background: rgba(239,68,68,0.2);
    opacity: 1;
  }
  
  .empty {
    text-align: center; padding: 80px 20px;
    color: #71717a;
  }
  .empty-icon { font-size: 60px; margin-bottom: 12px; opacity: 0.5; }
  .empty h3 { font-size: 18px; color: #fff; margin-bottom: 8px; }
  .empty p { font-size: 14px; margin-bottom: 20px; }
  .empty-btn {
    display: inline-block; padding: 12px 24px;
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    color: #fff; text-decoration: none;
    border-radius: 10px; font-weight: 700; font-size: 14px;
  }
  
  .spinner {
    display: inline-block; width: 32px; height: 32px;
    border: 3px solid rgba(139,92,246,0.2);
    border-top-color: #8b5cf6;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #16a34a; color: #fff;
    padding: 12px 24px; border-radius: 10px;
    font-size: 14px; font-weight: 600;
    transition: transform 0.3s; z-index: 9999;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <nav class="nav">
    <a href="/dashboard" class="back-btn">← Back</a>
    <h1>🔔 Notifications</h1>
    <div class="nav-actions">
      <button class="nav-action-btn" onclick="markAllRead()">✅ Read All</button>
      <button class="nav-action-btn danger" onclick="clearAll()">🗑 Clear</button>
    </div>
  </nav>

  <div class="container">
    
    <div class="stats-bar" id="statsBar">
      <div class="stat-chip">📬 Total: <strong id="statTotal">0</strong></div>
      <div class="stat-chip">🔴 Unread: <strong id="statUnread">0</strong></div>
      <div class="stat-chip">👁 Read: <strong id="statRead">0</strong></div>
    </div>

    <div id="list">
      <div style="text-align:center;padding:40px;"><div class="spinner"></div></div>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <script>
    let allNotifs = [];

    async function loadNotifs() {
      try {
        const res = await fetch('/api/notifications');
        if (!res.ok) { window.location.href = '/login'; return; }
        allNotifs = await res.json();
        renderNotifs();
      } catch (e) {
        document.getElementById('list').innerHTML =
          '<div class="empty"><div class="empty-icon">⚠️</div><h3>Failed to load</h3></div>';
      }
    }

    function renderNotifs() {
      const list = document.getElementById('list');
      
      // Stats
      const total = allNotifs.length;
      const unread = allNotifs.filter(n => !n.read).length;
      const read = total - unread;
      document.getElementById('statTotal').textContent = total;
      document.getElementById('statUnread').textContent = unread;
      document.getElementById('statRead').textContent = read;
      
      if (!total) {
        list.innerHTML =
          '<div class="empty">' +
            '<div class="empty-icon">🔔</div>' +
            '<h3>কোনো notification নেই</h3>' +
            '<p>এখানে আপনার notifications দেখা যাবে</p>' +
            '<a href="/shop" class="empty-btn">🛍 Shop এ যান</a>' +
          '</div>';
        return;
      }
      
      list.innerHTML = allNotifs.map(n => {
        const time = timeAgo(n.createdAt);
        return '<div class="notif-item ' + (n.read ? '' : 'unread') + '" onclick="handleClick(\'' + n._id + '\', ' + (n.link ? '\'' + n.link + '\'' : 'null') + ')">' +
          '<div class="notif-icon">' + (n.icon || '🔔') + '</div>' +
          '<div class="notif-body">' +
            '<div class="notif-title">' + esc(n.title) + '</div>' +
            '<div class="notif-msg">' + esc(n.message) + '</div>' +
            '<div class="notif-time">🕐 ' + time + '</div>' +
          '</div>' +
          '<button class="notif-delete" onclick="event.stopPropagation(); deleteNotif(\'' + n._id + '\')">🗑</button>' +
        '</div>';
      }).join('');
    }

    async function handleClick(id, link) {
      // Mark as read
      const notif = allNotifs.find(n => n._id === id);
      if (notif && !notif.read) {
        try {
          await fetch('/api/notifications/read/' + id, { method: 'POST' });
          notif.read = true;
          renderNotifs();
        } catch (e) {}
      }
      
      // Navigate
      if (link) {
        setTimeout(() => window.location.href = link, 200);
      }
    }

    async function deleteNotif(id) {
      try {
        const res = await fetch('/api/notifications/' + id, { method: 'DELETE' });
        if (!res.ok) throw new Error('Failed');
        allNotifs = allNotifs.filter(n => n._id !== id);
        renderNotifs();
        showToast('🗑 Deleted');
      } catch (e) {
        showToast('❌ Failed', '#dc2626');
      }
    }

    async function markAllRead() {
      try {
        const res = await fetch('/api/notifications/read-all', { method: 'POST' });
        if (!res.ok) throw new Error('Failed');
        allNotifs.forEach(n => n.read = true);
        renderNotifs();
        showToast('✅ All read');
      } catch (e) {
        showToast('❌ Failed', '#dc2626');
      }
    }

    async function clearAll() {
      if (!confirm('সব notification delete করবে?')) return;
      try {
        const res = await fetch('/api/notifications/clear/all', { method: 'DELETE' });
        if (!res.ok) throw new Error('Failed');
        allNotifs = [];
        renderNotifs();
        showToast('🗑 All cleared');
      } catch (e) {
        showToast('❌ Failed', '#dc2626');
      }
    }

    function timeAgo(date) {
      const sec = Math.floor((new Date() - new Date(date)) / 1000);
      if (sec < 60) return 'এইমাত্র';
      const min = Math.floor(sec / 60);
      if (min < 60) return min + ' মিনিট আগে';
      const hr = Math.floor(min / 60);
      if (hr < 24) return hr + ' ঘণ্টা আগে';
      const day = Math.floor(hr / 24);
      if (day < 7) return day + ' দিন আগে';
      return new Date(date).toLocaleDateString();
    }

    function showToast(msg, color) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.background = color || '#16a34a';
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function esc(s) {
      return String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    loadNotifs();
  </script>
</body>
</html>
