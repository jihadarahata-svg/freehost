<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — FreeHost</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0f0f14; color: #fff; min-height: 100vh;
  }
  
  .nav {
    background: #1a1a22; padding: 14px 20px;
    display: flex; align-items: center; gap: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    position: sticky; top: 0; z-index: 100;
  }
  .back-btn {
    background: transparent; border: none; color: #a1a1aa;
    font-size: 22px; cursor: pointer; padding: 4px 8px;
    text-decoration: none;
  }
  .back-btn:hover { color: #fff; }
  .nav h1 { font-size: 17px; font-weight: 700; }
  .wallet-pill {
    margin-left: auto;
    background: linear-gradient(135deg, #10b981, #059669);
    color: #fff; padding: 8px 14px;
    border-radius: 20px; font-size: 13px;
    font-weight: 700; text-decoration: none;
  }
  
  .container { max-width: 700px; margin: 0 auto; padding: 20px; }
  
  .photo-box {
    aspect-ratio: 16/10;
    background: linear-gradient(135deg, #2a1a4a, #1a1a3e);
    border-radius: 16px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-size: 80px; margin-bottom: 20px;
    position: relative;
  }
  .photo-box img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .discount-badge {
    position: absolute; top: 14px; right: 14px;
    background: #ef4444; color: #fff;
    padding: 6px 12px; border-radius: 20px;
    font-size: 13px; font-weight: 800;
  }
  
  .title {
    font-size: 22px; font-weight: 800;
    margin-bottom: 8px; letter-spacing: -0.5px;
  }
  .meta {
    display: flex; gap: 12px; font-size: 12px;
    color: #71717a; margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .meta span { display: flex; align-items: center; gap: 4px; }
  
  .price-box {
    display: flex; align-items: baseline; gap: 10px;
    padding: 16px; background: #1a1a22;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px; margin-bottom: 16px;
  }
  .price-main {
    font-size: 32px; font-weight: 900;
    color: #f59e0b; letter-spacing: -1px;
  }
  .price-old {
    font-size: 16px; color: #71717a;
    text-decoration: line-through;
  }
  .price-save {
    margin-left: auto; font-size: 12px;
    color: #4ade80; font-weight: 700;
    background: rgba(74,222,128,0.1);
    padding: 4px 10px; border-radius: 20px;
  }
  
  .card {
    background: #1a1a22;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px; padding: 16px;
    margin-bottom: 16px;
  }
  .card h3 {
    font-size: 14px; font-weight: 800;
    margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
  }
  .card p {
    font-size: 13px; color: #a1a1aa;
    line-height: 1.6; white-space: pre-wrap;
  }
  
  .balance-info {
    display: flex; justify-content: space-between;
    padding: 12px 14px; background: rgba(16,185,129,0.08);
    border: 1px solid rgba(16,185,129,0.25);
    border-radius: 10px; margin-bottom: 14px;
    font-size: 13px;
  }
  .balance-info strong { color: #34d399; font-size: 16px; }
  
  .buy-btn {
    width: 100%; padding: 16px;
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    color: #fff; border: none;
    border-radius: 12px; font-size: 16px;
    font-weight: 800; cursor: pointer;
    font-family: inherit;
    box-shadow: 0 12px 30px -8px rgba(139,92,246,0.5);
    transition: 0.2s;
  }
  .buy-btn:hover:not(:disabled) { transform: translateY(-2px); }
  .buy-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  
  .owned-box {
    background: rgba(16,185,129,0.1);
    border: 1px solid rgba(16,185,129,0.3);
    border-radius: 12px; padding: 16px;
    margin-bottom: 16px;
  }
  .owned-box h3 {
    color: #34d399; font-size: 14px;
    margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
  }
  .delivery-content {
    background: #0f0f14; border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px; padding: 12px;
    font-family: monospace; font-size: 12px;
    color: #c4b5fd; word-break: break-all;
    max-height: 200px; overflow: auto;
    white-space: pre-wrap;
  }
  .action-btn {
    display: inline-block; margin-top: 10px;
    padding: 8px 16px; background: rgba(139,92,246,0.2);
    color: #c4b5fd; border: 1px solid rgba(139,92,246,0.4);
    border-radius: 8px; font-size: 12px;
    font-weight: 700; cursor: pointer;
    text-decoration: none; margin-right: 8px;
    font-family: inherit;
  }
  .action-btn:hover { background: rgba(139,92,246,0.3); }
  
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    display: none; align-items: center; justify-content: center;
    z-index: 1000; padding: 16px;
    backdrop-filter: blur(6px);
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #1a1a22; border: 1px solid #333;
    border-radius: 16px; padding: 24px;
    width: 100%; max-width: 400px;
    animation: pop 0.3s;
  }
  @keyframes pop {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .modal h3 {
    font-size: 18px; font-weight: 800;
    margin-bottom: 16px; text-align: center;
  }
  .modal-info {
    background: #0f0f14; border-radius: 10px;
    padding: 14px; margin-bottom: 16px;
    font-size: 13px; line-height: 2;
  }
  .modal-info-row {
    display: flex; justify-content: space-between;
  }
  .modal-info-row strong { color: #f59e0b; }
  .modal-btns { display: flex; gap: 8px; }
  .modal-btns button {
    flex: 1; padding: 12px;
    border: none; border-radius: 10px;
    font-weight: 800; font-size: 13px;
    cursor: pointer; font-family: inherit;
  }
  .btn-cancel { background: #2a2a32; color: #a1a1aa; }
  .btn-confirm {
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    color: #fff;
  }
  
  .spinner {
    display: inline-block; width: 40px; height: 40px;
    border: 3px solid rgba(139,92,246,0.2);
    border-top-color: #8b5cf6;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #16a34a; color: #fff;
    padding: 12px 24px; border-radius: 10px;
    font-size: 14px; font-weight: 600;
    transition: transform 0.3s; z-index: 9999;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <nav class="nav">
    <a href="/shop" class="back-btn">←</a>
    <h1>Product Details</h1>
    <a href="/wallet" class="wallet-pill" id="walletPill">💰 ৳0</a>
  </nav>

  <div class="container" id="mainContainer">
    <div style="text-align:center;padding:60px;"><div class="spinner"></div></div>
  </div>

  <div class="modal-overlay" id="buyModal">
    <div class="modal">
      <h3>🛒 Confirm Purchase</h3>
      <div class="modal-info">
        <div class="modal-info-row"><span>Product:</span><strong id="mTitle">-</strong></div>
        <div class="modal-info-row"><span>Price:</span><strong id="mPrice">-</strong></div>
        <div class="modal-info-row"><span>Your Balance:</span><strong id="mBalance">-</strong></div>
        <div class="modal-info-row" style="border-top:1px solid #333;padding-top:8px;margin-top:8px;"><span>After Purchase:</span><strong id="mAfter">-</strong></div>
      </div>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeBuyModal()">Cancel</button>
        <button class="btn-confirm" onclick="confirmBuy()">✅ Confirm & Buy</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let product = null;
    let userWallet = 0;
    let alreadyOwned = false;
    const productId = window.location.pathname.split('/').pop();

    async function loadUser() {
      try {
        const res = await fetch('/api/me');
        if (res.ok) {
          const user = await res.json();
          userWallet = user.wallet || 0;
          document.getElementById('walletPill').textContent = '💰 ৳' + userWallet;
        }
      } catch (e) {}
    }

    async function loadProduct() {
      try {
        const res = await fetch('/api/shop/product/' + productId);
        if (!res.ok) { document.getElementById('mainContainer').innerHTML = '<div style="text-align:center;padding:60px;color:#71717a;">❌ Product not found</div>'; return; }
        product = await res.json();
        
        // Check if already purchased
        const ownRes = await fetch('/api/shop/access/' + productId);
        if (ownRes.ok) {
          const own = await ownRes.json();
          alreadyOwned = true;
          product.deliveryType = own.deliveryType;
          product.deliveryData = own.deliveryData;
        }
        
        render();
      } catch (e) {
        document.getElementById('mainContainer').innerHTML = '<div style="text-align:center;padding:60px;color:#71717a;">❌ Error loading product</div>';
      }
    }

    function render() {
      const price = product.discountPrice || product.price;
      const discount = product.discountPrice ? Math.round((1 - product.discountPrice / product.price) * 100) : 0;
      const photoHtml = product.photo
        ? '<img src="' + esc(product.photo) + '" onerror="this.parentElement.innerHTML=\'📦\'">'
        : '📦';
      
      const canAfford = userWallet >= price;
      
      let html = 
        '<div class="photo-box">' + photoHtml +
          (discount ? '<div class="discount-badge">-' + discount + '%</div>' : '') +
        '</div>' +
        '<h1 class="title">' + esc(product.title) + '</h1>' +
        '<div class="meta">' +
          '<span>📁 ' + esc(product.category || 'Other') + '</span>' +
          '<span>⭐ ' + (product.sold || 0) + ' sold</span>' +
          '<span>📦 ' + (product.stock || 0) + ' in stock</span>' +
        '</div>' +
        '<div class="price-box">' +
          '<div class="price-main">৳' + price + '</div>' +
          (product.discountPrice ? '<div class="price-old">৳' + product.price + '</div>' : '') +
          (product.discountPrice ? '<div class="price-save">Save ৳' + (product.price - product.discountPrice) + '</div>' : '') +
        '</div>';
      
      if (product.description) {
        html += '<div class="card"><h3>📝 Description</h3><p>' + esc(product.description) + '</p></div>';
      }
      
      if (alreadyOwned) {
        html += '<div class="owned-box">' +
          '<h3>✅ You own this product</h3>' +
          '<p style="font-size:12px;color:#a1a1aa;margin-bottom:10px;">' +
            (product.deliveryType === 'file' ? '📁 File Download:' : product.deliveryType === 'code' ? '💻 Code:' : '🔗 Link:') +
          '</p>' +
          '<div class="delivery-content">' + esc(product.deliveryData) + '</div>' +
          (product.deliveryType === 'link' || product.deliveryType === 'file' 
            ? '<a href="' + esc(product.deliveryData) + '" target="_blank" class="action-btn">🔗 Open Link</a>' : '') +
          '<button class="action-btn" onclick="copyDelivery()">📋 Copy</button>' +
        '</div>';
      } else {
        html += '<div class="balance-info">' +
          '<span>💰 Your Balance:</span>' +
          '<strong>৳' + userWallet + '</strong>' +
        '</div>';
        
        if (!canAfford) {
          html += '<div style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#f87171;padding:12px;border-radius:10px;font-size:13px;margin-bottom:14px;">' +
            '⚠️ আপনার balance কম। আরো ৳' + (price - userWallet) + ' add করুন।' +
          '</div>' +
          '<a href="/wallet" class="buy-btn" style="display:block;text-align:center;text-decoration:none;background:linear-gradient(135deg,#f59e0b,#ef4444);">💰 Add Money First</a>';
        } else {
          html += '<button class="buy-btn" onclick="openBuyModal()">🛒 Buy Now for ৳' + price + '</button>';
        }
      }
      
      document.getElementById('mainContainer').innerHTML = html;
    }

    function openBuyModal() {
      const price = product.discountPrice || product.price;
      document.getElementById('mTitle').textContent = product.title;
      document.getElementById('mPrice').textContent = '৳' + price;
      document.getElementById('mBalance').textContent = '৳' + userWallet;
      document.getElementById('mAfter').textContent = '৳' + (userWallet - price);
      document.getElementById('buyModal').classList.add('show');
    }
    function closeBuyModal() { document.getElementById('buyModal').classList.remove('show'); }

    async function confirmBuy() {
      try {
        const res = await fetch('/api/shop/buy/' + productId, { method: 'POST' });
        const data = await res.json();
        
        if (!res.ok) {
          showToast('❌ ' + (data.error || 'Failed'), '#dc2626');
          return;
        }
        
        showToast('✅ Purchase successful!');
        closeBuyModal();
        await loadUser();
        await loadProduct();
      } catch (e) {
        showToast('❌ Failed', '#dc2626');
      }
    }

    function copyDelivery() {
      navigator.clipboard.writeText(product.deliveryData);
      showToast('✅ Copied!');
    }

    function showToast(msg, color) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.background = color || '#16a34a';
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function esc(s) {
      return String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    loadUser().then(() => loadProduct());
  </script>
</body>
</html>
