<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — FreeHost</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; background: #0a0a0f; color: #fff; min-height: 100vh; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 20px; }
  
  .nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; margin-bottom: 24px; }
  .back-btn {
    color: #a1a1aa; text-decoration: none; font-size: 14px;
    padding: 8px 14px; border-radius: 8px;
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .back-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .wallet-pill {
    padding: 8px 16px;
    background: linear-gradient(135deg, #10b981, #059669);
    border-radius: 20px; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; gap: 6px;
    text-decoration: none; color: #fff;
  }
  
  .product-main { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 32px; }
  @media (max-width: 700px) { .product-main { grid-template-columns: 1fr; } }
  
  .product-image {
    width: 100%; aspect-ratio: 1;
    background: linear-gradient(135deg, #2a1a4a, #1a1a3e);
    border-radius: 20px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-size: 100px; position: relative;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .product-image img { width: 100%; height: 100%; object-fit: cover; }
  
  .product-info { display: flex; flex-direction: column; justify-content: center; }
  .product-category {
    display: inline-block; padding: 4px 12px;
    background: rgba(139,92,246,0.15);
    color: #c4b5fd; border-radius: 20px;
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 12px; width: fit-content;
  }
  .product-title { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 12px; line-height: 1.2; }
  .product-price-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 16px; }
  .product-price { font-size: 32px; font-weight: 900; color: #f59e0b; }
  .product-old { font-size: 16px; color: #71717a; text-decoration: line-through; }
  .product-discount {
    background: #ef4444; color: #fff;
    padding: 3px 10px; border-radius: 6px;
    font-size: 11px; font-weight: 800;
  }
  
  .product-desc {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px; padding: 16px; margin-bottom: 20px;
  }
  .product-desc-title {
    font-size: 12px; font-weight: 700; color: #a1a1aa;
    text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px;
  }
  .product-desc-text { font-size: 14px; color: #d4d4d8; line-height: 1.6; }
  
  .balance-info {
    background: rgba(139,92,246,0.08);
    border: 1px solid rgba(139,92,246,0.2);
    border-radius: 12px; padding: 16px; margin-bottom: 16px;
  }
  .balance-row {
    display: flex; justify-content: space-between;
    font-size: 14px; margin-bottom: 6px;
  }
  .balance-row:last-child { margin-bottom: 0; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.06); font-weight: 700; }
  .balance-row .lbl { color: #a1a1aa; }
  .balance-row .val { color: #fff; font-weight: 700; }
  .balance-row.final .val { color: #34d399; }
  
  .buy-btn {
    width: 100%; padding: 16px;
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    color: #fff; border: none; border-radius: 12px;
    font-size: 16px; font-weight: 800; cursor: pointer;
    margin-bottom: 10px;
    box-shadow: 0 12px 30px -8px rgba(139,92,246,0.5);
    font-family: inherit;
  }
  .buy-btn:hover:not(:disabled) { transform: translateY(-2px); }
  .buy-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .buy-btn.login { background: linear-gradient(135deg, #f59e0b, #d97706); }
  
  /* OWNED SECTION */
  .owned-box {
    background: linear-gradient(135deg, rgba(16,185,129,0.1), rgba(5,150,105,0.05));
    border: 2px solid rgba(16,185,129,0.4);
    border-radius: 16px; padding: 20px; margin-bottom: 16px;
  }
  .owned-title { font-size: 16px; font-weight: 800; color: #34d399; margin-bottom: 12px; }
  .owned-subtitle { font-size: 12px; color: #a1a1aa; margin-bottom: 16px; }
  
  .delivery-item {
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 14px;
    margin-bottom: 12px;
  }
  .delivery-item:last-child { margin-bottom: 0; }
  .delivery-item-head {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 700;
    color: #c4b5fd; margin-bottom: 10px;
  }
  .delivery-item-head .icon { font-size: 16px; }
  .delivery-content {
    background: #000; border: 1px solid #222;
    border-radius: 8px; padding: 10px 12px;
    font-family: monospace; font-size: 12px;
    color: #4ade80; word-break: break-all;
    margin-bottom: 8px; max-height: 150px;
    overflow: auto;
  }
  .delivery-content.textarea {
    color: #e4e4e7; font-size: 11px;
    white-space: pre-wrap; max-height: 250px;
  }
  .delivery-btn {
    width: 100%; padding: 10px;
    background: rgba(16,185,129,0.15);
    color: #34d399; border: 1px solid rgba(16,185,129,0.3);
    border-radius: 8px; font-size: 12px; font-weight: 700;
    cursor: pointer; text-decoration: none;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 6px; font-family: inherit;
  }
  .delivery-btn:hover { background: rgba(16,185,129,0.25); }
  
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    display: none; align-items: center; justify-content: center;
    z-index: 1000; padding: 16px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #151515; border: 1px solid #333;
    border-radius: 20px; padding: 24px;
    width: 100%; max-width: 400px; text-align: center;
  }
  .modal h2 { font-size: 20px; margin-bottom: 16px; }
  .modal p { color: #a1a1aa; margin-bottom: 20px; font-size: 14px; white-space: pre-line; }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btns button {
    flex: 1; padding: 12px; border-radius: 10px;
    font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: inherit; border: none;
  }
  .modal-cancel { background: #222; color: #fff; }
  .modal-confirm { background: linear-gradient(135deg, #8b5cf6, #6366f1); color: #fff; }
  
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #16a34a; color: #fff;
    padding: 12px 24px; border-radius: 10px;
    font-size: 14px; font-weight: 600;
    transition: transform 0.3s; z-index: 9999;
    max-width: 90%;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { background: #dc2626; }
  
  .loading { text-align: center; padding: 60px; color: #71717a; font-size: 14px; }
  .error-box { text-align: center; padding: 60px; color: #f87171; font-size: 14px; }
</style>
</head>
<body>
  <div class="wrap">
    
    <nav class="nav">
      <a href="/shop" class="back-btn" id="backBtn">← Back to Shop</a>
      <a href="/wallet" class="wallet-pill">
        💰 <span id="walletAmt">৳0</span>
      </a>
    </nav>
    
    <div id="productContainer">
      <div class="loading">Loading product...</div>
    </div>
    
  </div>
  
  <div class="modal-overlay" id="confirmModal">
    <div class="modal">
      <h2 id="confirmTitle">📦 Confirm Purchase</h2>
      <p id="confirmMsg">Are you sure?</p>
      <div class="modal-btns">
        <button class="modal-cancel" onclick="closeConfirm()" id="cancelBtn">❌ Cancel</button>
        <button class="modal-confirm" onclick="doBuy()" id="confirmBtn">✅ Confirm</button>
      </div>
    </div>
  </div>
  
  <div class="toast" id="toast"></div>
  
  <script>
    const urlMatch = window.location.pathname.match(/\/product\/(.+)$/);
    const productId = urlMatch ? urlMatch[1] : null;
    
    let product = null;
    let user = null;
    let content = {};
    let purchase = null;
    
    function showToast(msg, isError) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast' + (isError ? ' error' : '');
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }
    
    async function loadContent() {
      try {
        const res = await fetch('/api/content');
        content = await res.json();
        const p = content.product || {};
        
        if (p.backBtn) document.getElementById('backBtn').textContent = p.backBtn;
        if (p.confirmPurchaseTitle) document.getElementById('confirmTitle').textContent = p.confirmPurchaseTitle;
        if (p.cancelBtn) document.getElementById('cancelBtn').textContent = p.cancelBtn;
        if (p.confirmBtn) document.getElementById('confirmBtn').textContent = p.confirmBtn;
      } catch (e) {}
    }
    
    async function loadUser() {
      try {
        const res = await fetch('/api/me');
        if (res.ok) {
          user = await res.json();
          document.getElementById('walletAmt').textContent = '৳' + (user.wallet || 0);
        }
      } catch (e) {}
    }
    
    async function loadProduct() {
      if (!productId) {
        document.getElementById('productContainer').innerHTML = '<div class="error-box">❌ Product not found</div>';
        return;
      }
      
      try {
        const res = await fetch('/api/shop/product/' + productId);
        if (!res.ok) throw new Error('Not found');
        product = await res.json();
        
        if (user) {
          const pr = await fetch('/api/shop/access/' + productId);
          if (pr.ok) purchase = await pr.json();
        }
        
        render();
      } catch (e) {
        document.getElementById('productContainer').innerHTML = '<div class="error-box">❌ Product not found</div>';
      }
    }
    
    function render() {
      const container = document.getElementById('productContainer');
      const p = content.product || {};
      
      const photo = product.photo
        ? '<img src="' + esc(product.photo) + '" onerror="this.style.display=\'none\';this.parentElement.textContent=\'📦\'">'
        : '📦';
      
      const discount = product.discountPrice ? Math.round((1 - product.discountPrice / product.price) * 100) : 0;
      const price = product.discountPrice || product.price;
      
      let actionHtml = '';
      if (purchase) {
        actionHtml = renderOwned(p);
      } else if (!user) {
        actionHtml = '<button class="buy-btn login" onclick="location.href=\'/login\'">' + (p.loginToBuyBtn || '🔒 Login to Buy') + '</button>';
      } else {
        const after = (user.wallet || 0) - price;
        actionHtml = 
          '<div class="balance-info">' +
            '<div class="balance-row"><span class="lbl">' + (p.currentBalanceLabel || 'Your Balance') + '</span><span class="val">৳' + (user.wallet || 0) + '</span></div>' +
            '<div class="balance-row"><span class="lbl">' + (p.paidLabel || 'Paid') + '</span><span class="val">৳' + price + '</span></div>' +
            '<div class="balance-row final"><span class="lbl">' + (p.afterPurchaseLabel || 'After Purchase') + '</span><span class="val">৳' + after + '</span></div>' +
          '</div>' +
          '<button class="buy-btn" onclick="openConfirm()">' + (p.buyNowBtn || '🛒 Buy Now') + '</button>';
      }
      
      container.innerHTML =
        '<div class="product-main">' +
          '<div class="product-image">' + photo + '</div>' +
          '<div class="product-info">' +
            (product.category ? '<div class="product-category">📁 ' + esc(product.category) + '</div>' : '') +
            '<h1 class="product-title">' + esc(product.title) + '</h1>' +
            '<div class="product-price-row">' +
              '<span class="product-price">৳' + price + '</span>' +
              (product.discountPrice ? '<span class="product-old">৳' + product.price + '</span>' : '') +
              (discount > 0 ? '<span class="product-discount">-' + discount + '%</span>' : '') +
            '</div>' +
            actionHtml +
          '</div>' +
        '</div>' +
        (product.description 
          ? '<div class="product-desc">' +
              '<div class="product-desc-title">' + (p.descriptionLabel || '📝 Description') + '</div>' +
              '<div class="product-desc-text">' + esc(product.description).replace(/\n/g, '<br>') + '</div>' +
            '</div>'
          : '');
    }
    
    function renderOwned(p) {
      let html = 
        '<div class="owned-box">' +
          '<div class="owned-title">' + (p.purchasedTitle || '✅ Purchase Successful!') + '</div>' +
          '<div class="owned-subtitle">' + (p.deliveryReadyText || 'Your Product is Ready!') + '</div>';
      
      // Link
      if (purchase.linkData) {
        html += 
          '<div class="delivery-item">' +
            '<div class="delivery-item-head"><span class="icon">🔗</span> ' + (p.linkSectionTitle || 'Download Link') + '</div>' +
            '<div class="delivery-content">' + esc(purchase.linkData) + '</div>' +
            '<div style="display:flex; gap:6px;">' +
              '<a href="' + esc(purchase.linkData) + '" target="_blank" class="delivery-btn" style="flex:1;">' + (p.openLinkBtn || '🔗 Open Link') + '</a>' +
              '<button class="delivery-btn" onclick="copyText(\'' + escapeJs(purchase.linkData) + '\')" style="flex:1;">📋 Copy</button>' +
            '</div>' +
          '</div>';
      }
      
      // File
      if (purchase.fileData) {
        html += 
          '<div class="delivery-item">' +
            '<div class="delivery-item-head"><span class="icon">📁</span> ' + (p.fileSectionTitle || 'File Download') + '</div>' +
            '<div class="delivery-content">' + esc(purchase.fileData) + '</div>' +
            '<div style="display:flex; gap:6px;">' +
              '<a href="' + esc(purchase.fileData) + '" target="_blank" class="delivery-btn" style="flex:1;" download>' + (p.downloadBtn || '📥 Download') + '</a>' +
              '<button class="delivery-btn" onclick="copyText(\'' + escapeJs(purchase.fileData) + '\')" style="flex:1;">📋 Copy</button>' +
            '</div>' +
          '</div>';
      }
      
      // Code
      if (purchase.codeData) {
        const codeId = 'code-' + Date.now();
        html += 
          '<div class="delivery-item">' +
            '<div class="delivery-item-head"><span class="icon">💻</span> ' + (p.codeSectionTitle || 'Source Code') + '</div>' +
            '<div class="delivery-content textarea" id="' + codeId + '">' + esc(purchase.codeData) + '</div>' +
            '<button class="delivery-btn" onclick="copyText(document.getElementById(\'' + codeId + '\').textContent)">' + (p.copyCodeBtn || '📋 Copy Code') + '</button>' +
          '</div>';
      }
      
      html += '</div>';
      return html;
    }
    
    function escapeJs(str) {
      return String(str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, '\\n');
    }
    
    function copyText(text) {
      navigator.clipboard.writeText(text);
      showToast('✅ Copied!');
    }
    
    function openConfirm() {
      const p = content.product || {};
      document.getElementById('confirmMsg').textContent = 
        product.title + ' — ৳' + (product.discountPrice || product.price) + 
        '\n\n' + (p.currentBalanceLabel || 'Your Balance') + ': ৳' + (user?.wallet || 0);
      document.getElementById('confirmModal').classList.add('show');
    }
    
    function closeConfirm() {
      document.getElementById('confirmModal').classList.remove('show');
    }
    
    async function doBuy() {
      const btn = document.getElementById('confirmBtn');
      btn.disabled = true;
      btn.textContent = '⏳ Processing...';
      
      try {
        const res = await fetch('/api/shop/buy/' + productId, { method: 'POST' });
        const data = await res.json();
        
        if (!res.ok) throw new Error(data.error || 'Purchase failed');
        
        showToast('✅ Purchase successful!');
        closeConfirm();
        
        setTimeout(() => {
          loadUser();
          loadProduct();
        }, 500);
      } catch (e) {
        showToast('❌ ' + e.message, true);
        btn.disabled = false;
        btn.textContent = content.product?.confirmBtn || '✅ Confirm';
      }
    }
    
    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({ 
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' 
      }[c]));
    }
    
    async function init() {
      await loadContent();
      await loadUser();
      await loadProduct();
    }
    init();
  </script>
</body>
</html>
